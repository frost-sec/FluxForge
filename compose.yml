name: ${FF_PROJECT:-fluxforge-v1}
networks:
  platform:
    name: ${FF_PROJECT:-fluxforge-v1}_net
volumes:
  postgres-data:
  minio-data:
  go-mod:
  go-build:
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fluxforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxforge-dev}
      POSTGRES_DB: fluxforge
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fluxforge -d fluxforge]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [platform]
  minio:
    image: minio/minio@sha256:fa9210d2556f5350b063b821bb7b4c521de4377c822715d27daf9f884d7c0117
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-fluxforge}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-fluxforge-dev-secret}
    volumes: [minio-data:/data]
    ports:
      - "127.0.0.1:${MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    networks: [platform]
  control-plane:
    image: fluxforge-control-runtime:dev
    build:
      context: .
      dockerfile: deploy/Dockerfile.control
      target: runtime
    environment:
      DB_DSN: postgres://fluxforge:${POSTGRES_PASSWORD:-fluxforge-dev}@postgres:5432/fluxforge?sslmode=disable
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-19000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-fluxforge}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-fluxforge-dev-secret}
      MINIO_BUCKET: fluxforge
      PUBLIC_ADDR: :9090
      INTERNAL_ADDR: :9091
      HTTP_ADDR: :8080
      FF_PUBLIC_TOKEN: ${FF_PUBLIC_TOKEN:-local-public-dev}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-local-internal-dev}
      FF_PROJECT: ${FF_PROJECT:-fluxforge-v1}
      RUNNER_IMAGE: fluxforge-runner-runtime:dev
      NETWORK_NAME: ${FF_PROJECT:-fluxforge-v1}_net
      AUTOSCALING_ENABLED: ${AUTOSCALING_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    ports:
      - "127.0.0.1:${CONTROL_PORT:-19090}:9090"
      - "127.0.0.1:${HTTP_PORT:-18080}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
    stop_grace_period: 40s
    networks: [platform]
  ffctl:
    profiles: [tools]
    image: fluxforge-cli:dev
    build:
      context: .
      dockerfile: deploy/Dockerfile.control
      target: ffctl
    environment:
      FF_ADDR: control-plane:9090
      FF_INTERNAL_ADDR: control-plane:9091
      FF_PUBLIC_TOKEN: ${FF_PUBLIC_TOKEN:-local-public-dev}
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-local-internal-dev}
    networks: [platform]
  go-test:
    profiles: [tools]
    image: fluxforge-go-tools:dev
    volumes: [".:/workspace", "go-mod:/go/pkg/mod", "go-build:/root/.cache/go-build"]
    environment:
      FF_TEST_DSN: postgres://fluxforge:${POSTGRES_PASSWORD:-fluxforge-dev}@postgres:5432/fluxforge?sslmode=disable
    command: [bash, -c, "bash /workspace/scripts/codegen.sh && go test -race ./..."]
    networks: [platform]
  manual-runner:
    # Manually started workers are useful when AUTOSCALING_ENABLED=false.
    profiles: [manual]
    image: fluxforge-runner-runtime:dev
    environment:
      QUEUE_ADDR: control-plane:9091
      RUNNER_SLOTS: 2
      FF_INTERNAL_TOKEN: ${FF_INTERNAL_TOKEN:-local-internal-dev}
    read_only: true
    tmpfs: ["/tmp:rw,exec,nosuid,nodev,size=268435456,mode=1777"]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    networks: [platform]
