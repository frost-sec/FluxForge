services:
  control-plane:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  otel-collector:
    image: otel/opentelemetry-collector:0.102.1
    command: [--config=/etc/otelcol/config.yaml]
    volumes: ["./deploy/otel-collector.yml:/etc/otelcol/config.yaml:ro"]
    networks: [platform]
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
    networks: [platform]
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:19099:9090"]
    networks: [platform]
